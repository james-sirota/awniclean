# Pretty URL: /care-guide is canonical; .html permanently redirects to it.
[[redirects]]
  from = "/care-guide.html"
  to = "/care-guide"
  status = 301
  force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[redirects]]
  from = "/favicon.png"
  to = "/images/favicon.png"
  status = 200
